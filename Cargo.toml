[package]
name = "galenium-fila"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "galenium_fila"

[dependencies]
redis = { version = "1.7.1", default-features = false, features = ["tokio-comp", "script"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "sync"] }
uuid = { version = "1.28.0", features = ["v7"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
